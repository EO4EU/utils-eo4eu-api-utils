[project]
name = "eo-4-eu-api-utils"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "dagger-io",
    "build~=1.2.2",
    "twine==6.1.0",
    "distlib==0.3.9",
    "requests==2.32.3",
    "setuptools==78.1.0",
]

[tool.uv.sources]
dagger-io = { path = "sdk", editable = true }

[build-system]
requires = ["hatchling==1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eo_4_eu_api_utils"]